---
- name: Lab 06 - Jinja2 Templates
  hosts: cisco_routers
  gather_facts: false

  vars:
    lab_name: "Lab 06 - Jinja2 Templates"
    project_name: "Ansible Network Automation"
    management_network: "192.168.40.0/24"

  tasks:

    - name: Render Cisco configuration from Jinja2 template
      ansible.builtin.template:
        src: ../templates/router_config.j2
        dest: "/tmp/{{ inventory_hostname }}_router_config.txt"
      delegate_to: localhost

    - name: Read generated configuration
      ansible.builtin.slurp:
        src: "/tmp/{{ inventory_hostname }}_router_config.txt"
      delegate_to: localhost
      register: rendered_config

    - name: Display generated configuration
      ansible.builtin.debug:
        msg: "{{ rendered_config.content | b64decode }}"
