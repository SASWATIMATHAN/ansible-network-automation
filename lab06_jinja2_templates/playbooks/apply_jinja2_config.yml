---
- name: Lab 06 - Apply Jinja2 Generated Configuration
  hosts: cisco_routers
  gather_facts: false

  vars:
    lab_name: "Lab 06 - Jinja2 Templates"
    project_name: "Ansible Network Automation"
    management_network: "192.168.40.0/24"

  tasks:

    - name: Apply Jinja2 generated configuration
      cisco.ios.ios_config:
        src: ../templates/router_config.j2
