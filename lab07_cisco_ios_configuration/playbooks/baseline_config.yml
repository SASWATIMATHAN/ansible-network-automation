---
- name: Lab 07 - Cisco IOS Configuration Baseline
  hosts: cisco_routers
  gather_facts: false

  tasks:
    - name: Get current interface configuration
      cisco.ios.ios_command:
        commands:
          - show running-config | section interface FastEthernet0/0
      register: baseline_output

    - name: Display current interface configuration
      ansible.builtin.debug:
        var: baseline_output.stdout_lines
