---
- name: Lab 08 - Ignore Errors Demonstration
  hosts: cisco_routers
  gather_facts: false

  tasks:

    - name: Generate a controlled failure
      ansible.builtin.fail:
        msg: "Intentional failure for ignore_errors demonstration"
      ignore_errors: true

    - name: Continue after ignored failure
      ansible.builtin.debug:
        msg: "Execution continued after the failure"

    - name: Verify router remains reachable
      cisco.ios.ios_command:
        commands:
          - show ip interface brief

    - name: Final status
      ansible.builtin.debug:
        msg: "IGNORE_ERRORS workflow completed"
